bindingsVersion = "1.0"

# Where this repository keeps its architecture, for the skills declared in skills.json.
# Every relative path resolves against this file's directory. The architecture lives under
# docs/architecture (style B on the architecture continuum's landscape: the architecture of a
# standalone component, in the component's own repository), in three folders that follow the
# continuum's spaces, demand, solution and runtime, plus decisions. docs/architecture/README.md
# is the map.

[suite.architecture]
# The architecture skill (it replaced the aaa-* skills in architecture-continuum 0.6.0): the whole
# architecture, checked against the continuum with npm run check:architecture, and where each kind
# of page is created. The assessment flows use the criteria the skill ships; bind assessment to an
# organisation's criteria folder to use its own.
root             = "../docs/architecture"
outcomeDir       = "../docs/architecture/demand/outcomes"
useCaseDir       = "../docs/architecture/demand/use-cases"
platformDir      = "../docs/architecture"
capabilityDir    = "../docs/architecture/demand/capabilities"
contextDir       = "../docs/architecture/solution/contexts"
abbDir           = "../docs/architecture/solution/abbs"
sbbDir           = "../docs/architecture/solution/sbbs"
serviceDir       = "../docs/architecture/runtime/services"
decisionDir      = "../docs/architecture/decisions"
considerationDir = "../docs/architecture/decisions"
patternDir       = "../docs/architecture/solution/patterns"

# --------------------------------------------------------------------- model
# The model skill's contract: how a document's tables and a draw.io diagram are read as one
# model. Identifiers sit on the <object> wrapper's attributes because mxCell ids do not survive
# copy and paste. Local identifiers (a plain number leading the cell, "01 Reader") stand for boxes
# with no catalogue entry, as a use case's participants do.

[model]
node_id_attrs = ["abb_id", "sbb_id"]
edge_id_attr  = "iface_id"
group_attr    = "pattern"
kind_attr     = "role"
local_pattern = '[0-9]{1,3}'
local_attr    = "local_id"

[[markdown.tables]]
section    = "Required Building Blocks"
entity     = "node"
id_pattern = 'ABB-[0-9]{3}|SBB-[0-9]{3}'
columns    = { id = "Building Block", label = "Building Block" }

[[markdown.tables]]
section    = "Participants"
entity     = "node"
id_pattern = 'ABB-[0-9]{3}|SBB-[0-9]{3}'
columns    = { id = "Participant", label = "Participant", group = "Kind" }

[[markdown.tables]]
section    = "Interactions"
entity     = "edge"
id_pattern = 'IF-[0-9]{2,3}|ABB-[0-9]{3}|SBB-[0-9]{3}'
columns    = { id = "Interface", source = "Provider", target = "Consumer", label = "Purpose" }

[[markdown.tables]]
section    = "Interfaces"
entity     = "edge"
id_pattern = 'IF-[0-9]{2,3}|ABB-[0-9]{3}|SBB-[0-9]{3}'
columns    = { id = "Interface", source = "Provider", target = "Consumer", label = "Purpose" }

[markdown.scenarios]
section         = "Scenarios"
heading_pattern = '^(S[0-9]+)\b[\s:.-]*(.*)$'
columns         = { step = "Step", actor = "Actor", target = "Target", action = "Action", edge = "Interface" }

# The catalogues every identifier is checked against: the ABB register is logical, the SBB
# register physical, so a pattern's abstraction is derived from its boxes.
[[catalogues]]
path   = "../docs/architecture/solution/abbs.csv"
column = "id"
level  = "logical"

[[catalogues]]
path   = "../docs/architecture/solution/sbbs.csv"
column = "id"
level  = "physical"

[rules]
node_missing_id        = "error"
node_duplicate_id      = "error"
node_id_mismatch       = "error"
edge_missing_id        = "error"
edge_unlabelled        = "warn"
edge_dangling          = "error"
edge_unknown_endpoint  = "error"
step_missing_fields    = "error"
step_not_contiguous    = "error"
step_endpoint_mismatch = "error"
not_in_catalogue       = "error"
doc_not_in_diagram     = "warn"
diagram_not_in_doc     = "warn"

[style]
node  = "rounded=1;whiteSpace=wrap;html=1;fillColor=#FFFFFF;strokeColor=#1B2A4A;fontColor=#1B2A4A;fontSize=14;align=center;verticalAlign=middle;"
edge  = "edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;fontSize=12;strokeColor=#3A4A66;fontColor=#3A4A66;labelBackgroundColor=#FFFFFF;"
badge = "ellipse;whiteSpace=wrap;html=1;fillColor=#14B8A6;strokeColor=none;fontColor=#FFFFFF;fontSize=14;fontStyle=1;"
flow  = "edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;dashed=1;strokeWidth=2;strokeColor=#0F8C7E;fontColor=#0F8C7E;fontSize=13;fontStyle=1;labelBackgroundColor=#FFFFFF;"

[suite.markdown-deck]
# Decks publish to site/static/decks, one folder per deck_id, with a PDF beside each:
# node scripts/publish-decks.mjs (markdown-deck publish docs/architecture --out site/static/decks --pdf).
theme = "default"
pdf   = true

[suite.pattern]
# The two kinds of pattern document the continuum names, never a bare pattern: the architecture
# pattern (conceptual or logical, technology-agnostic, AP-NNN) and the reference architecture
# (physical, technology-specific, RA-NNN), so the kind is read from the identifier.
outputDir = "../docs/architecture/solution/patterns"
idSeries  = "AP"
deckTheme = "default"

[suite.pattern.types.architecture-pattern]
label    = "Architecture pattern"
idSeries = "AP"
physical = "none"

[suite.pattern.types.reference-architecture]
label    = "Reference architecture"
idSeries = "RA"
physical = "most"

[suite.use-case]
outputDir = "../docs/architecture/demand/use-cases"
idSeries  = "UC"

[suite.cross-reference]
# This catalogue's short code is ks; other catalogues cite its identifiers as ks:SV-001.
namespaces = "../docs/architecture/registers/identifier-namespaces.csv"
schemes    = "../docs/architecture/registers/identifier-schemes.csv"
