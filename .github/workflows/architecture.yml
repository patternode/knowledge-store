# The architecture under docs/architecture against the architecture continuum: the aaa-continuum
# skill's check, every finding failing. It runs only when the architecture, its skill declarations
# or the installer change, so a pull request that touches anything else never sees it, and nobody
# needs the skills installed to contribute: the job fetches them itself from the releases
# .agents/skills.json declares, at the commits .agents/skills.lock.json pins.
name: Architecture
on:
  push:
    branches: [main]
    paths:
      - "docs/architecture/**"
      - ".agents/**"
      - "scripts/skills.mjs"
      - ".github/workflows/architecture.yml"
  pull_request:
    paths:
      - "docs/architecture/**"
      - ".agents/**"
      - "scripts/skills.mjs"
      - ".github/workflows/architecture.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install the skills the repository declares, at the locked commits
        run: node scripts/skills.mjs sync --locked
      - run: node .agents/skills/aaa-continuum/bin/continuum.mjs doctor
      - run: npm run check:architecture
