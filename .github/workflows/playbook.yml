# Generated by playbook.mjs sync from patternode-architecture governance/playbook/ci-workflow.yml
# (playbook 1.1.0). Do not edit here: change the source and sync.
#
# Checks, with no network and nothing from patternode-architecture, that this repository's AGENTS.md
# carries the Patternode playbook block unedited (its text matches the hash in its begin marker) and
# that .agents/playbook.yaml names its trunk and roles for the same playbook version.

name: Playbook

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playbook:
    name: Playbook block and profile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check the AGENTS.md block and .agents/playbook.yaml
        run: |
          node --input-type=module - <<'EOF'
          import { existsSync, readFileSync } from "node:fs";
          import { createHash } from "node:crypto";
          const problems = [];
          const read = (f) => readFileSync(f, "utf8").replace(/\r\n/g, "\n");
          let version = null;
          if (!existsSync("AGENTS.md")) problems.push("AGENTS.md is missing.");
          else {
            const m = /<!-- playbook:begin (\d+\.\d+\.\d+) sha256:([0-9a-f]{16})[^\n]*-->\n([\s\S]*?)\n<!-- playbook:end -->/.exec(read("AGENTS.md"));
            if (!m) problems.push("AGENTS.md has no playbook block with a hash. Run playbook.mjs sync from patternode-architecture governance/playbook.");
            else {
              version = m[1];
              const hash = createHash("sha256").update(m[3].trim()).digest("hex").slice(0, 16);
              if (hash !== m[2]) problems.push("The playbook block in AGENTS.md was edited by hand. Change governance/playbook/agents-block.md in patternode-architecture and run playbook.mjs sync instead.");
            }
          }
          const required = ["repository", "playbook", "trunk", "merge_role", "release_role", "owner"];
          if (!existsSync(".agents/playbook.yaml")) problems.push(".agents/playbook.yaml is missing.");
          else {
            const p = {};
            for (const line of read(".agents/playbook.yaml").split("\n")) {
              const kv = /^([a-z_]+):\s*(.*?)\s*$/.exec(line);
              if (!kv) continue;
              let v = kv[2].replace(/\s+#.*$/, "");
              if (/^".*"$|^'.*'$/.test(v)) v = v.slice(1, -1);
              p[kv[1]] = v;
            }
            for (const k of required) if (!p[k]) problems.push(`.agents/playbook.yaml: ${k} is missing or empty.`);
            if (version && p.playbook && p.playbook !== version.split(".").slice(0, 2).join(".")) problems.push(`.agents/playbook.yaml says playbook ${p.playbook}, but AGENTS.md carries ${version}.`);
          }
          for (const line of problems) console.log(`::error::${line}`);
          if (problems.length) process.exit(1);
          console.log(`playbook ${version}: block unedited, profile complete`);
          EOF
