name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pydantic
      - run: pytest -q
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"
      - run: terraform fmt -check -recursive infra && terraform fmt -check -recursive examples/deployment
      - working-directory: infra/stack
        run: terraform init -backend=false -input=false && terraform validate
      # Offline tests against a mocked AWS provider (the portal's edge protection).
      - working-directory: infra/modules/portal
        run: terraform init -backend=false -input=false && terraform test
      # The deployment template, against this checkout's module instead of the release it pins.
      - name: validate examples/deployment
        run: |
          cp -r examples/deployment .ci-deployment
          sed -i 's#"git::https://github.com/patternode/knowledge-store.git//infra/modules/knowledge-store?ref=[^"]*"#"../infra/modules/knowledge-store"#' .ci-deployment/main.tf
          grep -q '"../infra/modules/knowledge-store"' .ci-deployment/main.tf
          cd .ci-deployment && terraform init -backend=false -input=false && terraform validate
  cloudformation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cfn-lint
      - run: cfn-lint infra/launch/knowledge-store.yaml
  prepublish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/prepublish_check.py .
