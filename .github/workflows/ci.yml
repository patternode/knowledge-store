name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pydantic
      # Coverage floors per context and layer only rise (docs/engineering-standard.md, section 7).
      - run: pytest -q --cov=knowledge_store --cov-report=json:coverage.json
      - run: python tests/check_coverage.py coverage.json
  core:
    # The core with no SDK extras: every AWS and backend test skips, everything else must pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e . pytest
      - run: pytest -q -rs
  ports:
    # The port contracts against MongoDB, Neo4j and Apache AGE.
    runs-on: ubuntu-latest
    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017
      NEO4J_TEST_URI: bolt://127.0.0.1:7687
      NEO4J_TEST_PASSWORD: knowledge-store-test
      AGE_TEST_DSN: host=127.0.0.1 port=5455 dbname=postgres user=postgres password=knowledge-store-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: docker compose -f tests/emulators.yml up -d --wait
      - run: pip install -e ".[dev]"
      - run: pytest -q -rs tests/platform_services/contracts/test_ports.py tests/knowledge_graph/contracts/test_graph.py tests/knowledge_graph/contracts/test_docstore.py
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.3"
      - run: terraform fmt -check -recursive infra && terraform fmt -check -recursive examples/deployment
      - working-directory: infra/stack
        run: terraform init -backend=false -input=false && terraform validate && terraform test
      # The deployment template, against this checkout's module instead of the release it pins.
      - name: validate examples/deployment
        run: |
          cp -r examples/deployment .ci-deployment
          sed -i 's#"git::https://github.com/patternode/knowledge-store.git//infra/modules/knowledge-store?ref=[^"]*"#"../infra/modules/knowledge-store"#' .ci-deployment/main.tf
          grep -q '"../infra/modules/knowledge-store"' .ci-deployment/main.tf
          cd .ci-deployment && terraform init -backend=false -input=false && terraform validate
  cloudformation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install cfn-lint
      - run: cfn-lint infra/launch/knowledge-store.yaml
  site:
    # The documentation site: a broken link, anchor or image fails the build (docusaurus.config.mjs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
  prepublish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python scripts/prepublish_check.py .
