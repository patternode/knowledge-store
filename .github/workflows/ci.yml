name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pydantic
      - run: pytest -q
  core:
    # The core with no cloud's SDK: every cloud test skips, everything else must pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest
      - run: pytest -q -rs
  ports:
    # The port contracts against Azurite, fake-gcs-server, MongoDB, Neo4j and Apache AGE.
    runs-on: ubuntu-latest
    env:
      AZURITE_BLOB_URL: http://127.0.0.1:10000/devstoreaccount1
      STORAGE_EMULATOR_HOST: http://127.0.0.1:4443
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017
      NEO4J_TEST_URI: bolt://127.0.0.1:7687
      NEO4J_TEST_PASSWORD: knowledge-store-test
      AGE_TEST_DSN: host=127.0.0.1 port=5455 dbname=postgres user=postgres password=knowledge-store-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: docker compose -f tests/emulators.yml up -d --wait
      - run: pip install -e ".[dev]"
      - run: |
          for port in 10000 4443; do
            for i in $(seq 1 30); do curl -s -o /dev/null "http://127.0.0.1:$port/" && break; sleep 2; done
          done
      - run: pytest -q -rs tests/test_ports.py tests/test_graph.py tests/test_docstore.py
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"
      - run: terraform fmt -check -recursive infra && terraform fmt -check -recursive deploy && terraform fmt -check -recursive examples/deployment
      - working-directory: infra/stack
        run: terraform init -backend=false -input=false && terraform validate
      - working-directory: deploy/azure/stack
        run: terraform init -backend=false -input=false && terraform validate
      - working-directory: deploy/azure/bootstrap
        run: terraform init -backend=false -input=false && terraform validate
      # The deployment template, against this checkout's module instead of the release it pins.
      - name: validate examples/deployment
        run: |
          cp -r examples/deployment .ci-deployment
          sed -i 's#"git::https://github.com/patternode/knowledge-store.git//infra/modules/knowledge-store?ref=[^"]*"#"../infra/modules/knowledge-store"#' .ci-deployment/main.tf
          grep -q '"../infra/modules/knowledge-store"' .ci-deployment/main.tf
          cd .ci-deployment && terraform init -backend=false -input=false && terraform validate
  cloudformation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cfn-lint
      - run: cfn-lint infra/launch/knowledge-store.yaml
  prepublish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/prepublish_check.py .
