# Builds the documentation site with Docusaurus and publishes it to GitHub Pages as a GitHub
# Actions deployment: the built site is uploaded as an artifact and deployed from it.
#
# Repository setting, once, by a repository admin: Settings, Pages, Source: GitHub Actions. The
# configure-pages step reads the site's origin and base path from that setting, so the build
# follows wherever Pages serves the site. The repository is public, so the site is public.
#
# The build is strict (docusaurus.config.mjs): a broken link, anchor, image or duplicate route
# fails it, and with it the deploy. CI builds the site on every pull request, so a broken
# reference is caught before it reaches main.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Read the Pages origin and base path
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE_URL: ${{ format('{0}/', steps.pages.outputs.base_path) }}
        run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
