# Builds the documentation site with Docusaurus and publishes it to GitHub Pages as a GitHub
# Actions deployment: the built site is uploaded as an artifact and deployed from it.
#
# Repository setting, once, by a repository admin: Settings, Pages, Source: GitHub Actions. The
# configure-pages step reads the site's origin and base path from that setting, so the build
# follows wherever Pages serves the site. The repository is public, so the site is public.
#
# The build is strict (docusaurus.config.mjs): a broken link, anchor, image or duplicate route
# fails it, and with it the deploy. CI builds the site on every pull request, so a broken
# reference is caught before it reaches main.
name: Deploy site

on:
  push:
    # publish is the branch the site is published from while work is staged there ahead of
    # main; a push to either deploys. The github-pages environment must allow both branches.
    branches: [main, publish]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Read the Pages origin and base path
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Build site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE_URL: ${{ format('{0}/', steps.pages.outputs.base_path) }}
        run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
