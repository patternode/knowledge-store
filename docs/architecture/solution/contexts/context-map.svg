<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 790" width="1400" height="790" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Context map of Knowledge Store</title>
<desc id="d">Eight bounded contexts inside PL-001. The pipeline runs left to right: Ingestion supplies silver to Extraction, which supplies gold to Knowledge graph, which is an open host of tools to Answering. Ontology publishes its language to Extraction and Knowledge graph, is called by Ingestion, and receives a candidate register from Answering. Portal and identity invokes Answering as the person and shares the index module with Knowledge graph, a shared kernel still to cut. Evaluation asks Answering. Platform services is an open host every context uses: the model client, the ledger and the lake port.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#007fa0"/></marker><marker id="arri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a56f5"/></marker></defs>
<rect width="1400" height="790" fill="#ffffff"/>
<text x="30" y="36" font-size="20" font-weight="bold" fill="#1b202c" text-anchor="start">Context map of Knowledge Store</text>
<text x="30" y="58" font-size="12" font-weight="normal" fill="#525c74" text-anchor="start">Eight bounded contexts inside PL-001 and their relationships in strategic DDD terms. An arrow points from the upstream context to the one that depends on it.</text>
