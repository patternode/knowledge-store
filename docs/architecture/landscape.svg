<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 830" width="1400" height="830" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Landscape: where Knowledge Store sits</title>
<desc id="d">Three bands. Above: the consumers of Knowledge Store, a host deployment, any organisation's deployment and a person's AI assistant over MCP, reaching it through the module, the chat page and API, the tools and the CLI. Middle: the platform PL-001 Knowledge Store, bounded contexts BC-001 to BC-008. Below: what it consumes as a service, Amazon Bedrock, Neptune, S3 and S3 Vectors, DynamoDB, Cognito, CloudFront and API Gateway, Lambda, ECS Fargate, CodeBuild and ECR, or off AWS the Anthropic API, a local folder and an optional graph backend.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#007fa0"/></marker></defs>
<rect width="1400" height="830" fill="#ffffff"/>
<text x="30" y="36" font-size="20" font-weight="bold" fill="#1b202c" text-anchor="start">Landscape: where Knowledge Store sits</text>
<text x="30" y="58" font-size="12" font-weight="normal" fill="#525c74" text-anchor="start">What consumes the store above it, and what the store consumes below it. The store depends on nothing above it.</text>
<rect x="30" y="96" width="1340" height="150" rx="12" fill="#f5f7fb" stroke="none"/>
<text x="52" y="122" font-size="11" font-weight="bold" fill="#525c74" text-anchor="start">CONSUMERS</text>
<text x="52" y="138" font-size="10.5" font-weight="normal" fill="#7e8aa7" text-anchor="start">Who uses the store, and through which self-service interface</text>
<rect x="52" y="152" width="418.6666666666667" height="80" rx="8" fill="#ecf9ff" stroke="#afe4f9" stroke-width="1.2" />
<text x="68" y="178" font-size="13" font-weight="bold" fill="#1b202c" text-anchor="start">A host deployment</text>
<text x="68" y="198" font-size="11" font-weight="normal" fill="#3e465a" text-anchor="start">A consuming application's own repository</text>
<text x="68" y="214" font-size="11" font-weight="normal" fill="#3e465a" text-anchor="start">A pinned release of the module</text>
<rect x="490.6666666666667" y="152" width="418.6666666666667" height="80" rx="8" fill="#ecf9ff" stroke="#afe4f9" stroke-width="1.2" />
<text x="506.6666666666667" y="178" font-size="13" font-weight="bold" fill="#1b202c" text-anchor="start">Any organisation's deployment</text>
<text x="506.6666666666667" y="198" font-size="11" font-weight="normal" fill="#3e465a" text-anchor="start">From examples/deployment</text>
<text x="506.6666666666667" y="214" font-size="11" font-weight="normal" fill="#3e465a" text-anchor="start">Pinned to a release, in its own AWS account</text>
<rect x="929.3333333333334" y="152" width="418.6666666666667" height="80" rx="8" fill="#ecf9ff" stroke="#afe4f9" stroke-width="1.2" />
<text x="945.3333333333334" y="178" font-size="13" font-weight="bold" fill="#1b202c" text-anchor="start">A person's own AI assistant</text>
<text x="945.3333333333334" y="198" font-size="11" font-weight="normal" fill="#3e465a" text-anchor="start">Over MCP; the consumer exposes the tools</text>
<text x="945.3333333333334" y="214" font-size="11" font-weight="normal" fill="#3e465a" text-anchor="start">Fronted by a consuming application</text>
<line x1="700" y1="246" x2="700" y2="334" stroke="#007fa0" stroke-width="2" marker-end="url(#arr)"/>
<rect x="264.20000000000005" y="276" width="208.79999999999998" height="32" rx="16" fill="#ffffff" stroke="#afe4f9" stroke-width="1.2"/>
<text x="276.20000000000005" y="296" font-size="10.5" font-weight="bold" fill="#007fa0" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace">CT-010</text>
<text x="321.80000000000007" y="296" font-size="10.5" font-weight="normal" fill="#3e465a" text-anchor="start">the Terraform module</text>
<rect x="485" y="276" width="215.39999999999998" height="32" rx="16" fill="#ffffff" stroke="#afe4f9" stroke-width="1.2"/>
<text x="497" y="296" font-size="10.5" font-weight="bold" fill="#007fa0" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace">CT-001</text>
<text x="542.6" y="296" font-size="10.5" font-weight="normal" fill="#3e465a" text-anchor="start">the chat page and API</text>
<rect x="752.4" y="276" width="248.39999999999998" height="32" rx="16" fill="#ffffff" stroke="#afe4f9" stroke-width="1.2"/>
<text x="764.4" y="296" font-size="10.5" font-weight="bold" fill="#007fa0" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace">CT-002, CT-003</text>
<text x="862.8" y="296" font-size="10.5" font-weight="normal" fill="#3e465a" text-anchor="start">the tools over MCP</text>
<rect x="1012.8" y="276" width="123" height="32" rx="16" fill="#ffffff" stroke="#afe4f9" stroke-width="1.2"/>
<text x="1024.8" y="296" font-size="10.5" font-weight="bold" fill="#007fa0" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace">CT-014</text>
<text x="1070.3999999999999" y="296" font-size="10.5" font-weight="normal" fill="#3e465a" text-anchor="start">the CLI</text>
<rect x="30" y="338" width="1340" height="120" rx="12" fill="#1b202c"/>
<rect x="30" y="338" width="6" height="120" rx="3" fill="#00b8e6"/>
<text x="60" y="366" font-size="11" font-weight="bold" fill="#00b8e6" text-anchor="start">THIS PLATFORM</text>
<text x="60" y="398" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="start">PL-001 Knowledge Store</text>
<text x="60" y="424" font-size="11.5" font-weight="normal" fill="#b9c2d8" text-anchor="start">Documents in, an ontology-typed knowledge graph out, and answers with every statement linked to its source. Deployed as one stack in the owner's account.</text>
<text x="1046" y="372" font-size="10.5" font-weight="normal" fill="#b9c2d8" text-anchor="middle">Bounded contexts</text>
<rect x="746" y="384" width="68" height="28" rx="6" fill="#2c3342" stroke="#525c74" stroke-width="1"/>
<text x="780" y="402" font-size="10.5" font-weight="normal" fill="#ffffff" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace">BC-001</text>
