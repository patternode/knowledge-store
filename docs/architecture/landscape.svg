<rect x="1050" y="384" width="68" height="28" rx="6" fill="#2c3342" stroke="#525c74" stroke-width="1"/>
<text x="1084" y="402" font-size="10.5" font-weight="normal" fill="#ffffff" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace">BC-005</text>
<rect x="1126" y="384" width="68" height="28" rx="6" fill="#2c3342" stroke="#525c74" stroke-width="1"/>
<text x="1160" y="402" font-size="10.5" font-weight="normal" fill="#ffffff" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace">BC-006</text>
<rect x="1202" y="384" width="68" height="28" rx="6" fill="#2c3342" stroke="#525c74" stroke-width="1"/>
<text x="1236" y="402" font-size="10.5" font-weight="normal" fill="#ffffff" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace">BC-007</text>
<rect x="1278" y="384" width="68" height="28" rx="6" fill="#2c3342" stroke="#525c74" stroke-width="1"/>
<text x="1312" y="402" font-size="10.5" font-weight="normal" fill="#ffffff" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace">BC-008</text>
<line x1="700" y1="458" x2="700" y2="546" stroke="#007fa0" stroke-width="2" marker-end="url(#arr)"/>
<rect x="580.4" y="488" width="239.2" height="32" rx="16" fill="#ffffff" stroke="#afe4f9" stroke-width="1.2"/>
<text x="700" y="508" font-size="10.5" font-weight="normal" fill="#3e465a" text-anchor="middle">what it consumes, X-as-a-Service</text>
<rect x="30" y="550" width="1340" height="250" rx="12" fill="#f5f7fb" stroke="none"/>
<text x="52" y="576" font-size="11" font-weight="bold" fill="#525c74" text-anchor="start">BELOW</text>
<text x="52" y="592" font-size="10.5" font-weight="normal" fill="#7e8aa7" text-anchor="start">The managed services the store runs on, and the alternatives off AWS</text>
<rect x="52" y="606" width="309" height="112" rx="8" fill="#f4f6ff" stroke="#d1d8ff" stroke-width="1.2" />
<text x="68" y="626" font-size="9.5" font-weight="bold" fill="#5a56f5" text-anchor="start">MODELS AND AGENTS</text>
<text x="68" y="646" font-size="12.5" font-weight="bold" fill="#1b202c" text-anchor="start">Amazon Bedrock</text>
<text x="68" y="666" font-size="10.5" font-weight="normal" fill="#3e465a" text-anchor="start">Claude models</text>
<text x="68" y="680" font-size="10.5" font-weight="normal" fill="#3e465a" text-anchor="start">The embedding model</text>
<text x="68" y="694" font-size="10.5" font-weight="normal" fill="#3e465a" text-anchor="start">Knowledge Bases, Guardrails</text>
<text x="68" y="708" font-size="10.5" font-weight="normal" fill="#3e465a" text-anchor="start">AgentCore Runtime and Gateway</text>
<rect x="381" y="606" width="309" height="112" rx="8" fill="#f4f6ff" stroke="#d1d8ff" stroke-width="1.2" />
<text x="397" y="626" font-size="9.5" font-weight="bold" fill="#5a56f5" text-anchor="start">DATA</text>
<text x="397" y="646" font-size="12.5" font-weight="bold" fill="#1b202c" text-anchor="start">Neptune, S3, DynamoDB</text>
<text x="397" y="666" font-size="10.5" font-weight="normal" fill="#3e465a" text-anchor="start">Amazon Neptune: the graph</text>
<text x="397" y="680" font-size="10.5" font-weight="normal" fill="#3e465a" text-anchor="start">S3 and S3 Vectors: the record</text>
<text x="397" y="694" font-size="10.5" font-weight="normal" fill="#3e465a" text-anchor="start">and the index</text>
<text x="397" y="708" font-size="10.5" font-weight="normal" fill="#3e465a" text-anchor="start">DynamoDB: chat state</text>
<rect x="710" y="606" width="309" height="112" rx="8" fill="#f4f6ff" stroke="#d1d8ff" stroke-width="1.2" />
<text x="726" y="626" font-size="9.5" font-weight="bold" fill="#5a56f5" text-anchor="start">EDGE AND IDENTITY</text>
<text x="726" y="646" font-size="12.5" font-weight="bold" fill="#1b202c" text-anchor="start">Cognito, CloudFront, API Gateway</text>
<text x="726" y="666" font-size="10.5" font-weight="normal" fill="#3e465a" text-anchor="start">Cognito: sign-in</text>
<text x="726" y="680" font-size="10.5" font-weight="normal" fill="#3e465a" text-anchor="start">CloudFront and API Gateway:</text>
<text x="726" y="694" font-size="10.5" font-weight="normal" fill="#3e465a" text-anchor="start">the edge</text>
<rect x="1039" y="606" width="309" height="112" rx="8" fill="#f4f6ff" stroke="#d1d8ff" stroke-width="1.2" />
<text x="1055" y="626" font-size="9.5" font-weight="bold" fill="#5a56f5" text-anchor="start">COMPUTE AND BUILDS</text>
<text x="1055" y="646" font-size="12.5" font-weight="bold" fill="#1b202c" text-anchor="start">Lambda, Fargate, CodeBuild, ECR</text>
<text x="1055" y="666" font-size="10.5" font-weight="normal" fill="#3e465a" text-anchor="start">Lambda</text>
<text x="1055" y="680" font-size="10.5" font-weight="normal" fill="#3e465a" text-anchor="start">ECS Fargate</text>
<text x="1055" y="694" font-size="10.5" font-weight="normal" fill="#3e465a" text-anchor="start">CodeBuild and ECR</text>
<rect x="52" y="736" width="1296" height="50" rx="8" fill="#ffffff" stroke="#b9c2d8" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="68" y="756" font-size="9.5" font-weight="bold" fill="#525c74" text-anchor="start">OR, OFF AWS</text>
<text x="68" y="774" font-size="11" font-weight="normal" fill="#3e465a" text-anchor="start">The Anthropic API for models, a local folder as the lake, and optionally Neo4j, Apache AGE or MongoDB as the graph</text>
</svg>
