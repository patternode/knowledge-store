<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="942" height="470" viewBox="0 0 942 470" role="img" aria-labelledby="title desc">
<title id="title">The deployables against the bounded contexts of the target state</title>
<desc id="desc">SV-001 Pipeline (the sweep) is owned by BC-001 and composes BC-001 BC-002 BC-003 BC-004. SV-002 Chat agent is owned by BC-005 and composes BC-005 BC-004. SV-003 Portal API is owned by BC-006 and composes BC-006 BC-004 BC-005. SV-004 Graph tools is owned by BC-004 and composes BC-004. SV-005 Passage tools is owned by BC-004 and composes BC-004. SV-006 Gateway interceptor is owned by BC-006 and composes BC-006. SV-007 Chat page is owned by BC-006 and composes BC-006. SV-008 Command line is owned by BC-008 and composes BC-001 BC-002 BC-003 BC-004 BC-008. SV-009 Evaluation runner is owned by BC-007 and composes BC-007.</desc>
<text x="0" y="24" fill="#1b202c" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="22" font-weight="600">The deployables against the same contexts</text>
<text x="0" y="48" fill="#525c74" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="14">A filled dot is the context a service is part of; a ring is a context it composes besides. One dot per row is the rule; the CN that names a row is beside its count.</text>
<circle cx="267" cy="74" r="12" fill="#007fa0"/><text x="267" y="78.5" fill="#ffffff" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
<text x="267" y="102" fill="#004e64" font-family="IBM Plex Mono, ui-monospace, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle">BC-002</text>
