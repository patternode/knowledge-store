<text x="1076" y="483.3333333333333" font-size="12.5" font-weight="bold" fill="#1b202c" text-anchor="start">Answers a reader can check</text>
<text x="1076" y="501.3333333333333" font-size="10.5" font-weight="normal" fill="#3e465a" text-anchor="start">Every shown statement passed the citation</text>
<text x="1076" y="515.3333333333333" font-size="10.5" font-weight="normal" fill="#3e465a" text-anchor="start">and grounding checks</text>
<rect x="1060" y="549.3333333333333" width="300" height="92" rx="8" fill="#f4f6ff" stroke="#d1d8ff" stroke-width="1.2"/>
