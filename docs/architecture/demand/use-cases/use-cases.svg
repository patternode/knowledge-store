<text x="1076" y="717.3333333333333" font-size="10.5" font-weight="normal" fill="#3e465a" text-anchor="start">One account, one stack, idle cost close to</text>
<text x="1076" y="731.3333333333333" font-size="10.5" font-weight="normal" fill="#3e465a" text-anchor="start">nothing</text>
