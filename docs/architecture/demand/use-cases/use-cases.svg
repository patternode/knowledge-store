<text x="1076" y="609.3333333333333" font-size="10.5" font-weight="normal" fill="#3e465a" text-anchor="start">Every version curated by a person; a change</text>
<text x="1076" y="623.3333333333333" font-size="10.5" font-weight="normal" fill="#3e465a" text-anchor="start">costs what its class allows</text>
