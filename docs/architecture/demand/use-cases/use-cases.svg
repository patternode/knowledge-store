<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 866" width="1400" height="866" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Use cases of Knowledge Store</title>
<desc id="d">Four actors on the left, a reader, a curator, an administrator and an evaluator, each linked to the use cases they perform inside the PL-001 Knowledge Store boundary, and each use case linked on the right to the outcome it serves: OC-001 answers a reader can check, OC-002 an ontology the organisation owns, OC-003 a store the organisation runs itself.</desc>
<rect width="1400" height="866" fill="#ffffff"/>
<text x="30" y="36" font-size="20" font-weight="bold" fill="#1b202c" text-anchor="start">Use cases of Knowledge Store</text>
<text x="30" y="58" font-size="12" font-weight="normal" fill="#525c74" text-anchor="start">Who gets what from the store. An actor on the left performs the use cases it is joined to; each use case serves one outcome on the right.</text>
