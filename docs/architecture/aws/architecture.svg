<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A505C"/></marker>
<marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B6FC9"/></marker>
<style>
text { font-family: Inter, 'DejaVu Sans', sans-serif; }
.h1 { font-size: 26px; font-weight: 700; fill: #1D2129; }
.sub { font-size: 15px; fill: #505663; }
.lane { font-size: 11.5px; font-weight: 700; letter-spacing: 1.2px; fill: #7A8190; }
.svc { font-size: 12px; font-weight: 600; }
.title { font-size: 16px; font-weight: 700; }
.body { font-size: 13px; }
.chip { font-size: 13px; font-weight: 600; }
.lbl { font-size: 12px; fill: #3A3F48; font-weight: 500; paint-order: stroke; stroke: #F7F8FA; stroke-width: 4px; }
.nh { font-size: 14px; font-weight: 700; fill: #1D2129; }
.note { font-size: 13px; fill: #3A3F48; }
.foot { font-size: 12px; fill: #7A8190; }
</style></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="40" y="48" class="h1">Knowledge Store on AWS: minimal GraphRAG</text>
<text x="40" y="74" class="sub">Ingestion fills a knowledge graph and a passage index; chat answers from both, and every claim shown is checked against a cited passage.</text>
<rect x="28" y="96" width="440" height="736" rx="14" fill="#F7F8FA" stroke="#DDE1E7"/>
<text x="42" y="118" class="lane">INGESTION</text>
<rect x="548" y="96" width="424" height="736" rx="14" fill="#F7F8FA" stroke="#DDE1E7"/>
<text x="562" y="118" class="lane">SHARED: GRAPH, PASSAGES, MODELS</text>
<rect x="1068" y="96" width="504" height="736" rx="14" fill="#F7F8FA" stroke="#DDE1E7"/>
<text x="1082" y="118" class="lane">CHAT</text>
<rect x="40" y="132" width="400" height="95" rx="10" fill="#E6F4F1" stroke="#2E8B7A" stroke-width="1.6"/>
<text x="54" y="156" class="svc" fill="#2E8B7A">Amazon S3</text>
<text x="54" y="176" class="title" fill="#14463D">Lake: landing/&lt;collection&gt;/</text>
<text x="54" y="196" class="body" fill="#14463D">Uploads, parsed text, passages, gold RDF,</text>
<text x="54" y="213" class="body" fill="#14463D">ontology versions</text>
<path d="M240,227 L240,266" fill="none" stroke="#4A505C" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="252" y="243" class="lbl" text-anchor="start">upload event or schedule</text>
<text x="252" y="258" class="lbl" text-anchor="start">EventBridge · SQS · Pipes · Scheduler</text>
<rect x="40" y="270" width="400" height="546" rx="10" fill="#E8EFFB" stroke="#3B6FC9" stroke-width="1.6"/>
<text x="54" y="294" class="svc" fill="#3B6FC9">Amazon ECS Fargate · public subnets, no NAT</text>
<text x="54" y="314" class="title" fill="#1B3566">The sweep (idempotent)</text>
<rect x="60" y="336" width="110" height="24" rx="12" fill="#fff" stroke="#3B6FC9" stroke-width="1.2"/>
<text x="115.0" y="352.5" class="chip" fill="#1B3566" text-anchor="middle">ingest</text>
<rect x="190" y="336" width="110" height="24" rx="12" fill="#fff" stroke="#3B6FC9" stroke-width="1.2"/>
<text x="245.0" y="352.5" class="chip" fill="#1B3566" text-anchor="middle">refine</text>
<text x="60" y="388" class="body" fill="#1B3566">Ontology, one of two ways:</text>
<rect x="60" y="400" width="110" height="24" rx="12" fill="#fff" stroke="#3B6FC9" stroke-width="1.2"/>
<text x="115.0" y="416.5" class="chip" fill="#1B3566" text-anchor="middle">discover</text>
<rect x="190" y="400" width="110" height="24" rx="12" fill="#fff" stroke="#3B6FC9" stroke-width="1.2"/>
<text x="245.0" y="416.5" class="chip" fill="#1B3566" text-anchor="middle">review</text>
<rect x="320" y="400" width="100" height="24" rx="12" fill="#fff" stroke="#3B6FC9" stroke-width="1.2"/>
<text x="370.0" y="416.5" class="chip" fill="#1B3566" text-anchor="middle">publish</text>
<text x="60" y="450" class="body" fill="#1B3566">or the one you provide (ontology_dir),</text>
<text x="60" y="467" class="body" fill="#1B3566">published by its owl:versionInfo</text>
<rect x="60" y="486" width="170" height="24" rx="12" fill="#fff" stroke="#3B6FC9" stroke-width="1.2"/>
<text x="145.0" y="502.5" class="chip" fill="#1B3566" text-anchor="middle">extract (SHACL)</text>
<rect x="250" y="486" width="110" height="24" rx="12" fill="#fff" stroke="#3B6FC9" stroke-width="1.2"/>
<text x="305.0" y="502.5" class="chip" fill="#1B3566" text-anchor="middle">project</text>
<path d="M170,348 L188,348" stroke="#3B6FC9" stroke-width="1.4" marker-end="url(#ahs)"/>
<path d="M170,412 L188,412" stroke="#3B6FC9" stroke-width="1.4" marker-end="url(#ahs)"/>
<path d="M300,412 L318,412" stroke="#3B6FC9" stroke-width="1.4" marker-end="url(#ahs)"/>
<path d="M230,498 L248,498" stroke="#3B6FC9" stroke-width="1.4" marker-end="url(#ahs)"/>
<text x="60" y="548" class="body" fill="#1B3566">Images for the pipeline and the agent are</text>
<text x="60" y="565" class="body" fill="#1B3566">built in your account by CodeBuild into ECR.</text>
<rect x="572" y="140" width="376" height="150" rx="10" fill="#F1EAFB" stroke="#7B4FC9" stroke-width="1.6"/>
<text x="586" y="164" class="svc" fill="#7B4FC9">Amazon Bedrock</text>
<text x="586" y="184" class="title" fill="#3B2366">Models and screening</text>
<text x="586" y="204" class="body" fill="#3B2366">Claude: discovery, review, extraction,</text>
<text x="586" y="221" class="body" fill="#3B2366">and the chat agent</text>
<text x="586" y="238" class="body" fill="#3B2366">Titan Text Embeddings V2: passages</text>
<text x="586" y="255" class="body" fill="#3B2366">Guardrails: questions and grounding</text>
<rect x="560" y="352" width="400" height="318" rx="12" fill="none" stroke="#8A919E" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="574" y="372" class="lane" fill="#5A6170">VPC · PRIVATE SUBNETS · NO ROUTE OUT</text>
<rect x="580" y="386" width="360" height="112" rx="10" fill="#E6F4F1" stroke="#2E8B7A" stroke-width="1.6"/>
<text x="594" y="410" class="svc" fill="#2E8B7A">Amazon Neptune · SPARQL</text>
<text x="594" y="430" class="title" fill="#14463D">Knowledge graph</text>
<text x="594" y="450" class="body" fill="#14463D">Gold RDF: one named graph per document,</text>
<text x="594" y="467" class="body" fill="#14463D">plus the ontology itself · IAM auth</text>
<text x="594" y="484" class="body" fill="#14463D">db.t3.medium ≈ 60 USD/month (can be off)</text>
<rect x="580" y="560" width="360" height="95" rx="10" fill="#E8EFFB" stroke="#3B6FC9" stroke-width="1.6"/>
<text x="594" y="584" class="svc" fill="#3B6FC9">AWS Lambda</text>
<text x="594" y="604" class="title" fill="#1B3566">Graph tools</text>
<text x="594" y="624" class="body" fill="#1B3566">Fixed, read-only SPARQL built from</text>
<text x="594" y="641" class="body" fill="#1B3566">the ontology: entities, facts, paths</text>
<path d="M760,560 L760,502" fill="none" stroke="#4A505C" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="770" y="536" class="lbl" text-anchor="start">read-only</text>
<rect x="572" y="704" width="376" height="112" rx="10" fill="#E6F4F1" stroke="#2E8B7A" stroke-width="1.6"/>
<text x="586" y="728" class="svc" fill="#2E8B7A">Bedrock Knowledge Base · S3 Vectors</text>
<text x="586" y="748" class="title" fill="#14463D">Passage index</text>
<text x="586" y="768" class="body" fill="#14463D">One vector per passage, so a hit is</text>
<text x="586" y="785" class="body" fill="#14463D">a passage id · filtered to collection</text>
<text x="586" y="802" class="body" fill="#14463D">and the caller's scope</text>
<path d="M440,300 L568,300" fill="none" stroke="#4A505C" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="504" y="292" class="lbl" text-anchor="middle">model calls</text>
<path d="M440,440 L576,440" fill="none" stroke="#4A505C" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="508" y="432" class="lbl" text-anchor="middle">gold RDF</text>
<path d="M440,768 L568,768" fill="none" stroke="#4A505C" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="504" y="760" class="lbl" text-anchor="middle">every passage</text>
<rect x="1084" y="132" width="220" height="62" rx="10" fill="#FFFFFF" stroke="#555B66" stroke-width="1.6"/>
<text x="1098" y="156" class="title" fill="#22262E">A person</text>
<text x="1098" y="176" class="body" fill="#22262E">asks in the chat page</text>
<rect x="1336" y="132" width="220" height="88" rx="10" fill="#FDF1E2" stroke="#C98A2E" stroke-width="1.6"/>
<text x="1350" y="156" class="svc" fill="#C98A2E">Amazon Cognito · or site_sign_in</text>
<text x="1350" y="176" class="title" fill="#5C3D0F">Sign-in</text>
<text x="1350" y="196" class="body" fill="#5C3D0F">Cognito (private-readers), or</text>
<text x="1350" y="213" class="body" fill="#5C3D0F">a host website's grant</text>
<path d="M1304,163 L1332,163" fill="none" stroke="#4A505C" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M1194,194 L1194,222" fill="none" stroke="#4A505C" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="1084" y="226" width="472" height="66" rx="10" fill="#FDF1E2" stroke="#C98A2E" stroke-width="1.6"/>
<text x="1098" y="250" class="svc" fill="#C98A2E">Amazon CloudFront</text>
<text x="1098" y="270" class="title" fill="#5C3D0F">Chat and ontology pages (static, from S3)</text>
<path d="M1194,292 L1194,320" fill="none" stroke="#4A505C" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="1206" y="310" class="lbl" text-anchor="start">/api/*</text>
<rect x="1084" y="324" width="472" height="112" rx="10" fill="#E8EFFB" stroke="#3B6FC9" stroke-width="1.6"/>
<text x="1098" y="348" class="svc" fill="#3B6FC9">API Gateway · Lambda · DynamoDB</text>
<text x="1098" y="368" class="title" fill="#1B3566">Chat API</text>
<text x="1098" y="388" class="body" fill="#1B3566">Token or website grant checked · daily quota (30) · concurrency (20)</text>
<text x="1098" y="405" class="body" fill="#1B3566">asks the agent as the person, or as a service client by scope</text>
<text x="1098" y="422" class="body" fill="#1B3566">conversation and quota state in DynamoDB</text>
<path d="M1194,436 L1194,456" fill="none" stroke="#4A505C" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="1084" y="460" width="472" height="112" rx="10" fill="#F1EAFB" stroke="#7B4FC9" stroke-width="1.6"/>
<text x="1098" y="484" class="svc" fill="#7B4FC9">Amazon Bedrock AgentCore Runtime</text>
<text x="1098" y="504" class="title" fill="#3B2366">The chat agent</text>
<text x="1098" y="524" class="body" fill="#3B2366">Released ontology in its system prompt</text>
<text x="1098" y="541" class="body" fill="#3B2366">Answers as claims, each citing a passage + quote</text>
<text x="1098" y="558" class="body" fill="#3B2366">Code checks every citation; failed claims removed</text>
<path d="M1084,500 L1010,500 L1010,230 L952,230" fill="none" stroke="#4A505C" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="1002" y="370" class="lbl" text-anchor="middle" transform="rotate(-90 1002 370)">model, guardrail</text>
<path d="M1194,572 L1194,596" fill="none" stroke="#4A505C" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="1206" y="589" class="lbl" text-anchor="start">MCP, as the caller</text>
<rect x="1084" y="600" width="472" height="95" rx="10" fill="#E8EFFB" stroke="#3B6FC9" stroke-width="1.6"/>
<text x="1098" y="624" class="svc" fill="#3B6FC9">AgentCore Gateway (MCP)</text>
<text x="1098" y="644" class="title" fill="#1B3566">Tool gateway</text>
<text x="1098" y="664" class="body" fill="#1B3566">Interceptor writes the caller's scope into every</text>
<text x="1098" y="681" class="body" fill="#1B3566">call from the verified token</text>
<path d="M1084,630 L944,630" fill="none" stroke="#4A505C" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="1012" y="622" class="lbl" text-anchor="middle">graph tools</text>
<path d="M1194,695 L1194,716" fill="none" stroke="#4A505C" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="1084" y="720" width="472" height="96" rx="10" fill="#E8EFFB" stroke="#3B6FC9" stroke-width="1.6"/>
<text x="1098" y="744" class="svc" fill="#3B6FC9">AWS Lambda</text>
<text x="1098" y="764" class="title" fill="#1B3566">Passage tools</text>
<text x="1098" y="784" class="body" fill="#1B3566">Search by meaning, then read passages</text>
<text x="1098" y="801" class="body" fill="#1B3566">from the lake · outside the VPC</text>
<path d="M1084,768 L952,768" fill="none" stroke="#4A505C" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="1018" y="760" class="lbl" text-anchor="middle">Retrieve</text>
<text x="32" y="866" class="nh">Grounding</text>
<text x="32" y="888" class="note">No statement without a source: a claim survives only if its quote is</text>
<text x="32" y="906" class="note">in a passage the caller may read, is ≥ 12 characters, and the</text>
<text x="32" y="924" class="note">guardrail scores it grounded. One repair turn, then it is removed.</text>
<text x="552" y="866" class="nh">Valves</text>
<text x="552" y="888" class="note">Per question: 16 tool calls, 14 model calls, 4000 output tokens</text>
<text x="552" y="906" class="note">per call, 1 repair turn. Optional monthly budget alert.</text>
<text x="1072" y="866" class="nh">Sign-in, networking and cost</text>
<text x="1072" y="888" class="note">Cognito, or a host website that frames the pages (site_sign_in).</text>
<text x="1072" y="906" class="note">No NAT gateway; Neptune and the graph tools reach S3 through a</text>
<text x="1072" y="924" class="note">gateway endpoint. Neptune is the main fixed cost (can be off).</text>
<text x="28" y="990" class="foot">Design: docs/architecture/aws/aws.md · Terraform: infra/modules/knowledge-store · Deployment guide: docs/deploy/aws</text>
</svg>