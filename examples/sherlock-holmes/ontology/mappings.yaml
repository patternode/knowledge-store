# Curated mapping for the Holmes sample. People edit this file. Publish checks every
# class, attribute, relation and datatype against ontology.ttl, then renders
# r2rml-mapping.ttl. A CSV named here is bound as a table. A file not named here,
# including the story texts from fetch.py, stays a document.
#
# location is a path in this example. The same logical_table is what a later live
# source keeps: replace location with coa:<dataSourceId> and leave logical_table,
# the keys and the columns as they are. That string is rr:tableName and the metric
# source_table.

tables:
  stories:
    location: tables/stories.csv
    logical_table: stories
    class: Story
    key: [story_id]
    columns:
      story_id: {attribute: storyId}
      title: {attribute: title}
      collection: {attribute: collection}
      client: {attribute: client}
      crime: {attribute: crime}
      strand_issue: {relation: publishedIn, range: StrandIssue, match: issueId}
  strand_issues:
    location: tables/strand_issues.csv
    logical_table: strand_issues
    class: StrandIssue
    key: [issue_id]
    columns:
      issue_id: {attribute: issueId}
      year: {attribute: year, datatype: xsd:integer}
      month: {attribute: month, datatype: xsd:integer}
      magazine: {attribute: magazine}
