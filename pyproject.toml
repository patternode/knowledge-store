[project]
name = "knowledge-store"
version = "0.1.0"
description = "Domain-agnostic ontology discovery and extraction from unstructured content on AWS: a Patternode experiment"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "boto3>=1.40",
  "anthropic>=0.78,<1",
  "rdflib>=7.1",
  "pyshacl>=0.30",
  "pypdf>=5",
]

[project.optional-dependencies]
# One extra per cloud and backend, so no image carries another cloud's SDKs.
azure = ["azure-storage-blob>=12.20", "azure-storage-queue>=12.10", "azure-identity>=1.17", "pyjwt[crypto]>=2.8"]
gcp = ["google-cloud-storage>=2.18", "google-auth>=2.30", "pyjwt[crypto]>=2.8"]
mongo = ["pymongo>=4.8"]
neo4j = ["neo4j>=5.20"]
age = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "moto>=5", "azure-functions>=1.21", "knowledge-store[azure,gcp,mongo,neo4j,age]"]

[project.scripts]
knowledge-store = "knowledge_store.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"knowledge_store.ontology" = ["*.ttl"]
"knowledge_store.portal_api" = ["*.html", "*.js", "*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
