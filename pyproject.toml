[project]
name = "knowledge-store"
version = "0.1.0"
description = "Domain-agnostic ontology discovery and extraction from unstructured content on AWS: a Patternode experiment"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "boto3>=1.40",
  "anthropic>=0.78,<1",
  "rdflib>=7.1",
  "pyshacl>=0.30",
  "pypdf>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "moto>=5"]

[project.scripts]
knowledge-store = "knowledge_store.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"knowledge_store.ontology" = ["*.ttl"]
"knowledge_store.portal_api" = ["*.html", "*.js", "*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
