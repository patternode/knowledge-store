# Local stand-ins for the cloud services the port tests run against. Each test that needs one
# is skipped unless its variable is set:
#
#   docker compose -f tests/emulators.yml up -d
#   export AZURITE_BLOB_URL=http://127.0.0.1:10000/devstoreaccount1
#   export STORAGE_EMULATOR_HOST=http://127.0.0.1:4443
#   export MONGODB_TEST_URI=mongodb://127.0.0.1:27017
#   export NEO4J_TEST_URI=bolt://127.0.0.1:7687 NEO4J_TEST_PASSWORD=knowledge-store-test
#   export AGE_TEST_DSN="host=127.0.0.1 port=5455 dbname=postgres user=postgres password=knowledge-store-test"
#   pytest tests/test_ports.py tests/test_graph.py
services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
    ports: ["10000:10000"]
  gcs:
    image: fsouza/fake-gcs-server
    command: -scheme http -port 4443 -public-host 127.0.0.1:4443
    ports: ["4443:4443"]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/knowledge-store-test
    ports: ["7687:7687"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p knowledge-store-test 'RETURN 1' || exit 1"]
      interval: 5s
      retries: 30
  age:
    image: apache/age:release_PG16_1.5.0
    command: postgres -c shared_preload_libraries=age  # as Azure does, so readers need no LOAD
    environment:
      POSTGRES_PASSWORD: knowledge-store-test
    ports: ["5455:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 30
